name: Notify Homer on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  notify-homer:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.body, 'Auto generated by homer repositories')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Notify Homer API
        env:
          HOMER_WEBHOOK_URL: https://release.hevo.me/github/webhook/repo-creation/repo-generator/merged
          HOMER_API_KEY: ${{ secrets.HOMER_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "Sending notification to Homer..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -H "X-GitHub-Delivery: github-action-${{ github.run_id }}" \
            -H "X-API-KEY: $HOMER_API_KEY" \
            --data @"$GITHUB_EVENT_PATH" \
            "$HOMER_WEBHOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Successfully notified Homer (HTTP $HTTP_CODE)"
          else
            echo "Failed to notify Homer (HTTP $HTTP_CODE)"
            echo "Response: $RESPONSE_BODY"
            curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"Homer notification failed!\nPR: #${{ github.event.pull_request.number }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" \
            "$SLACK_WEBHOOK_URL"
            exit 1
          fi
